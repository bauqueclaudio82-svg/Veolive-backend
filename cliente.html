<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeoLive - Transmisión (Cliente)</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 20px; }
        video { width: 100%; max-width: 600px; border: 2px solid #444; border-radius: 8px; background: #000; }
        button { padding: 12px 20px; font-size: 16px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>
    <h1>VeoLive - Transmisor</h1>
    <div>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div>
        <button id="startBtn">Iniciar Transmisión</button>
    </div>

    <script>
        const localVideo = document.getElementById('localVideo');
        const startBtn = document.getElementById('startBtn');
        let localStream;
        let ws;

        // Conectar al WebSocket (asume que corre en el mismo host/puerto o ajusta la URL)
        function conectarWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);
            
            ws.onopen = () => console.log('Conectado al servidor de señalización');
            ws.onmessage = async (event) => {
                // Aquí manejaremos la señalización WebRTC en el siguiente ajuste si hace falta
            };
        }

        startBtn.onclick = async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true });
                localVideo.srcObject = localStream;
                conectarWS();
                startBtn.disabled = true;
                startBtn.textContent = "Transmitiendo...";
            } catch (err) {
                console.error("Error al acceder a la cámara:", err);
                alert("No se pudo acceder a la cámara o micrófono.");
            }
        };
    </script>
    <!-- Sección de Destino Personalizado -->
<section style="padding: 40px 20px; background: #f8f9fa; text-align: center; border-radius: 12px; margin: 20px 0;">
    <h2>🌍 ¿Querés explorar otro lugar del mundo?</h2>
    <p style="color: #666; margin-bottom: 20px;">Elegí cualquier ciudad o rincón del planeta y conectate con un anfitrión local en vivo.</p>
    
    <div style="max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="customLocation" placeholder="Ej: Tokio, Japón o Roma, Italia" style="padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;">
        
        <select id="durationSelect" style="padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background: white;">
            <option value="15">15 minutos - US$ 10</option>
            <option value="30" selected>30 minutos - US$ 18</option>
            <option value="60">1 hora - US$ 30</option>
        </select>
        
        <button onclick="handleCustomBooking()" style="background: #28a745; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
            Reservar Destino a Medida 🔒
        </button>
    </div>
</section>

<script>
    function handleCustomBooking() {
        const location = document.getElementById('customLocation').value;
        const duration = document.getElementById('durationSelect').value;
        
        if (!location.trim()) {
            alert('Por favor, ingresá un lugar válido.');
            return;
        }
        
        alert('Redirigiendo al pago seguro para tu experiencia en: ' + location + ' (' + duration + ' min)...');
    }
</script>
     <!-- Sección de Destino Personalizado -->
<section style="padding: 40px 20px; background: #0b1329; color: white; text-align: center; border-radius: 16px; margin: 20px 0;">
    <h2>🌍 ¿Querés otro lugar?</h2>
    <p style="color: #a0aec0; margin-bottom: 20px;">Escribí cualquier ciudad o rincón del mundo y solicitá una experiencia a medida.</p>
    
    <div style="max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;">
        <input type="text" id="customLocation" placeholder="Ej: Buenos Aires, Argentina" style="padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 16px; background: #fff; color: #333;">
        
        <select id="durationSelect" style="padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 16px; background: white; color: #333;">
            <option value="15">15 minutos - US$ 10</option>
            <option value="30" selected>30 minutos - US$ 18</option>
            <option value="60">1 hora - US$ 30</option>
        </select>
        
        <button onclick="handleCustomBooking()" style="background: #10b981; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
            Solicitar experiencia 🔒
        </button>
    </div>
</section>

<script>
    function handleCustomBooking() {
        const location = document.getElementById('customLocation').value;
        const duration = document.getElementById('durationSelect').value;
        
        if (!location.trim()) {
            alert('Por favor, ingresá una ciudad o lugar válido.');
            return;
        } 
        
        // Preparado para conectar con la pasarela de pago global (Stripe)
        alert('Conectando con la pasarela de pago global para tu experiencia en: ' + location + ' (' + duration + ' min)...');
    }
</script>
    
</body>
    
</html>
 <script>
    async function handleCustomBooking() {
        const location = document.getElementById('customLocation').value;
        const duration = document.getElementById('durationSelect').value;
        
        if (!location.trim()) {
            alert('Por favor, ingresá una ciudad o lugar válido.');
            return;
        }
        
        try {
            const response = await fetch('/api/crear-pago', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ location, duration })
            });
            
            const data = await response.json();
            
            if (data.url) {
                window.location.href = data.url; // Redirige a la pasarela de pago de Stripe
            } else {
                alert('Hubo un error al iniciar el pago. Intentalo de nuevo.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de conexión con el servidor.');
        }
    }
 </script>
