<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veo Live - Cliente</title>
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #000; color: #fff; overflow: hidden; height: 100vh; }
    
    .client-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.6) 100%),
                  url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    /* Header flotante */
    .header-overlay {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }
    .guide-info {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
    }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: #007aff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
    .status-badge { background: #28a745; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }

    /* Área de Chat Flotante */
    .chat-box {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .chat-msg {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      max-width: 80%;
      word-break: break-word;
    }

    /* Botones de Acción Rápida (Propinas y Pedidos) */
    .quick-actions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .action-chip {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .action-chip.tip { background: #28a745; border: none; }

    /* Input de Chat */
    .chat-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 12px 16px;
      border-radius: 24px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .chat-input::placeholder { color: rgba(255,255,255,0.7); }
    .send-btn {
      background: #007aff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="client-container">
    <!-- Header: Datos del Guía y Estado -->
    <div class="header-overlay">
      <div class="guide-info">
        <div class="avatar">G</div>
        <div>
          <div style="font-size: 13px; font-weight: bold;">Guía Veo Live</div>
          <div style="font-size: 10px; opacity: 0.8;">En recorrido</div>
        </div>
      </div>
      <div class="status-badge">🟢 Conectado</div>
    </div>

    <!-- Zona Inferior: Chat + Acciones Rápidas -->
    <div>
      <!-- Mensajes -->
      <div class="chat-box" id="chatBox">
        <div class="chat-msg"><b>Sistema:</b> ¡Bienvenido al recorrido en vivo!</div>
      </div>

      <!-- Botones de Acción Rápida -->
      <div class="quick-actions">
        <button class="action-chip tip" onclick="sendAction('💸 Propina $5')">💸 Propina $5</button>
        <button class="action-chip" onclick="sendAction('🔍 Enfocar aquí')">🔍 Enfocar</button>
        <button class="action-chip" onclick="sendAction('📸 Tomar Foto')">📸 Pedir Foto</button>
      </div>

      <!-- Input de Texto -->
      <div class="chat-input-row">
        <input type="text" id="msgInput" class="chat-input" placeholder="Escribí un mensaje al guía...">
        <button class="send-btn" onclick="sendMsg()">➔</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io('https://veolive-backend.onrender.com');
    const chatBox = document.getElementById('chatBox');

    socket.on('receive_message', (data) => {
      const msg = document.createElement('div');
      msg.className = 'chat-msg';
      msg.innerHTML = `<b>${data.sender}:</b> ${data.text}`;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    function sendMsg() {
      const input = document.getElementById('msgInput');
      if (!input.value.trim()) return;
      socket.emit('send_message', { sender: 'Cliente', text: input.value });
      input.value = '';
    }

    function sendAction(actionText) {
      socket.emit('send_quick_action', { sender: 'Cliente', text: actionText });
    }
  </script>

</body>
</html>
