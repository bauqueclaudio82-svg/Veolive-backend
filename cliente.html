<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VeoLive - Experiencia en vivo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #111827;
            color: white;
        }

        header {
            background: #0b1329;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            color: #a0aec0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .video-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            display: block;
            min-height: 300px;
            background: #000;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 13px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #startBtn {
            background: #10b981;
            color: white;
        }

        #stopBtn {
            background: #ef4444;
            color: white;
        }

        #stopBtn:disabled,
        #startBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .booking {
            background: white;
            color: #222;
            border-radius: 16px;
            padding: 30px 20px;
            margin-top: 25px;
        }

        .booking h2 {
            margin-top: 0;
            color: #111827;
        }

        .booking p {
            color: #666;
        }

        .form {
            max-width: 450px;
            margin: 20px auto 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        #bookingBtn {
            background: #10b981;
            color: white;
        }

        .status {
            text-align: center;
            padding: 10px;
            color: #a0aec0;
        }

        .secure {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🌍 VeoLive</h1>
    <p>Explorá el mundo en vivo con un anfitrión local</p>
</header>

<div class="container">

    <!-- VIDEOLLAMADA -->
    <section>

        <div class="video-container">
            <video
                id="localVideo"
                autoplay
                playsinline
                muted>
            </video>
        </div>

        <div class="status" id="status">
            Cámara y micrófono listos para iniciar.
        </div>

        <div class="controls">

            <button id="startBtn">
                🎥 Iniciar transmisión
            </button>

            <button id="stopBtn" disabled>
                ⛔ Finalizar
            </button>

        </div>

    </section>


    <!-- DESTINO PERSONALIZADO -->
    <section class="booking">

        <h2>🌍 ¿Querés explorar otro lugar?</h2>

        <p>
            Elegí una ciudad o lugar del mundo y solicitá
            una experiencia en vivo con un anfitrión local.
        </p>

        <div class="form">

            <input
                type="text"
                id="customLocation"
                placeholder="Ej: París, Francia">

            <select id="durationSelect">

                <option value="15">
                    15 minutos - US$ 10
                </option>

                <option value="30" selected>
                    30 minutos - US$ 18
                </option>

                <option value="60">
                    1 hora - US$ 30
                </option>

            </select>

            <button id="bookingBtn">
                🔒 Solicitar experiencia
            </button>

        </div>

        <div class="secure">
            Pago seguro. La experiencia se confirma después del pago.
        </div>

    </section>

</div>


<script>

    // ==========================================
    // VARIABLES
    // ==========================================

    const localVideo = document.getElementById("localVideo");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const status = document.getElementById("status");

    const bookingBtn = document.getElementById("bookingBtn");
    const customLocation = document.getElementById("customLocation");
    const durationSelect = document.getElementById("durationSelect");

    let localStream = null;
    let ws = null;


    // ==========================================
    // CONECTAR WEBSOCKET
    // ==========================================

    function conectarWS() {

        const protocol =
            window.location.protocol === "https:"
                ? "wss:"
                : "ws:";

        ws = new WebSocket(
            `${protocol}//${window.location.host}`
        );

        ws.onopen = () => {

            console.log(
                "Conectado al servidor de señalización"
            );

            status.textContent =
                "Conectado. Transmisión preparada.";
        };

        ws.onmessage = async (event) => {

            console.log(
                "Mensaje recibido:",
                event.data
            );

            /*
             * Aquí podremos agregar posteriormente
             * la señalización WebRTC completa.
             */
        };

        ws.onerror = (error) => {

            console.error(
                "Error WebSocket:",
                error
            );

        };

        ws.onclose = () => {

            console.log(
                "WebSocket desconectado"
            );

        };
    }


    // ==========================================
    // INICIAR TRANSMISIÓN
    // ==========================================

    startBtn.addEventListener("click", async () => {

        try {

            localStream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: "environment"
                    },

                    audio: true

                });

            localVideo.srcObject =
                localStream;

            conectarWS();

            startBtn.disabled = true;
            stopBtn.disabled = false;

            startBtn.textContent =
                "🎥 Transmitiendo...";

            status.textContent =
                "Transmisión activa.";

        }

        catch (error) {

            console.error(
                "Error al acceder a cámara/micrófono:",
                error
            );

            alert(
                "No se pudo acceder a la cámara o al micrófono. Verificá los permisos del navegador."
            );

        }

    });


    // ==========================================
    // FINALIZAR TRANSMISIÓN
    // ==========================================

    stopBtn.addEventListener("click", () => {

        if (localStream) {

            localStream
                .getTracks()
                .forEach(track => track.stop());

            localStream = null;
        }

        localVideo.srcObject = null;

        if (ws) {

            ws.close();
            ws = null;

        }

        startBtn.disabled = false;
        stopBtn.disabled = true;

        startBtn.textContent =
            "🎥 Iniciar transmisión";

        status.textContent =
            "Transmisión finalizada.";

    });


    // ==========================================
    // RESERVAR EXPERIENCIA
    // ==========================================

    bookingBtn.addEventListener(
        "click",
        handleCustomBooking
    );


    async function handleCustomBooking() {

        const location =
            customLocation.value.trim();

        const duration =
            durationSelect.value;


        // Validar destino

        if (!location) {

            alert(
                "Por favor, ingresá una ciudad o lugar válido."
            );

            customLocation.focus();

            return;
        }


        // Evitar múltiples clics

        bookingBtn.disabled = true;

        bookingBtn.textContent =
            "⏳ Preparando pago...";


        try {

            const response =
                await fetch(
                    "/api/crear-pago",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            location: location,

                            duration: duration

                        })

                    }
                );


            const data =
                await response.json();


            // Si el backend devuelve
            // la URL de Stripe

            if (data.url) {

                window.location.href =
                    data.url;

                return;
            }


            // Error enviado por backend

            console.error(
                "Respuesta del servidor:",
                data
            );

            alert(
                data.error ||
                "No se pudo iniciar el pago."
            );

        }

        catch (error) {

            console.error(
                "Error al conectar con el servidor:",
                error
            );

            alert(
                "No se pudo conectar con VeoLive. Verificá que el servidor esté funcionando."
            );

        }

        finally {

            bookingBtn.disabled = false;

            bookingBtn.textContent =
                "🔒 Solicitar experiencia";

        }

    }

</script>

</body>
</html>
